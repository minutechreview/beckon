<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<title>Offline · Beckon</title>
<style>
  /* Self-contained: the service worker serves this page when there is no network, so it loads nothing else. */
  :root { --bg: #f2f2f7; --surface: #fff; --text: #111114; --muted: #5e5e66; --accent: #1f5eff; --on-accent: #fff; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px rgb(0 0 0 / .04); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --surface: #1c1c1f; --text: #f2f2f5; --muted: #9c9ca3; --accent: #2a62f0; --shadow: 0 0 0 1px rgb(255 255 255 / .06); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 380px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 22px; display: grid; gap: 14px; justify-items: start; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  a.btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; border-radius: 12px; background: var(--accent);
    color: var(--on-accent); font-weight: 600; font-size: 17px; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1F5EFF"/><path d="M9.5 10.5 15 16l-5.5 5.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.5" cy="20" r="3" fill="#fff"/></svg>
  <h1>You&rsquo;re offline</h1>
  <p>Beckon shows your sessions live, so it needs a connection. Notifications still arrive when you&rsquo;re back online.</p>
  <a class="btn" href="/app">Try again</a>
</main>
</body>
</html>
