# Local dev Postgres. `docker compose up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beckon
      POSTGRES_PASSWORD: beckon
      POSTGRES_DB: beckon
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beckon"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
