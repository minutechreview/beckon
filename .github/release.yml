# Categories for generated release notes (by pull request label).
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement, detector]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
