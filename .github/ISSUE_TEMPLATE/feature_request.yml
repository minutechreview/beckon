name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working. Alternatives you considered are welcome too.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security impact
      options:
        - label: This would change what the server can see, what devices are trusted, or what can type into a terminal.
