# Builds, checksums and signs the helper when a version tag is pushed.
#   git tag v0.7.0 && git push origin v0.7.0
# install.sh verifies the signature against this file's name and the tag ref, so do not rename it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # keyless cosign signing and build provenance (GitHub OIDC)
      attestations: write   # SLSA build provenance for each archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Test the helper before releasing it
        run: go -C helper test ./...
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The service the released helper talks to unless told otherwise.
          BECKON_DEFAULT_SERVER: https://beckoncli.com
      - name: Build provenance for each archive (verify with `gh attestation verify <file> -R jaystewartuk/beckon`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
