# Release build of the helper (SPEC §12 M7). Run by .github/workflows/release.yml on a v* tag.
#
# - static binaries (CGO off) for macOS and Linux, amd64 and arm64
# - SHA-256 checksums in checksums.txt, signed keylessly with cosign through GitHub's OIDC identity
# - the production server URL baked in at build time; $BECKON_SERVER or `beckon login --server` override it
version: 2
project_name: beckon

before:
  hooks:
    - go -C helper mod download

builds:
  - id: beckon
    dir: helper
    main: ./cmd/beckon
    binary: beckon
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X beckoncli.com/helper/internal/account.DefaultServer={{ if index .Env "BECKON_DEFAULT_SERVER" }}{{ .Env.BECKON_DEFAULT_SERVER }}{{ else }}https://beckoncli.com{{ end }}

archives:
  - id: beckon
    formats: [tar.gz]
    name_template: "beckon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The archive holds the binary at its root: install.sh extracts `beckon` from it, and `beckon-chain` (the
    # chain runner, devbox/chain) when it is there. LICENSE and README.md are what GoReleaser adds by default.
    files:
      - LICENSE
      - README.md
      - src: devbox/chain
        dst: beckon-chain
        info:
          mode: 0755
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    output: true

changelog:
  use: github-native   # release notes from merged PR titles and labels (.github/release.yml)

release:
  github:
    owner: jaystewartuk
    name: beckon
  prerelease: auto
